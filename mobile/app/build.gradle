android {
    namespace 'com.onair.mobile'
    compileSdk 36  // 의존성 요구사항에 맞춰 36으로 업데이트 (일부는 35, 일부는 36 요구)

    defaultConfig {
        applicationId "com.onair.mobile"
        minSdk 30
        targetSdk 34  // targetSdk는 34 유지 (런타임 동작 변경 없음)
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // ✅ Orchestrator와의 연결 설정
        testInstrumentationRunnerArguments clearPackageData: 'true'

        // BuildConfig 필드 (환경 변수에서 읽거나 기본값 사용)
        // 주의: 프로덕션에서는 빈 문자열로 설정하고, 로그인 API를 통해 토큰을 받아야 합니다
        buildConfigField "String", "DEFAULT_ACCESS_TOKEN", "\"eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMyIsInR5cGUiOiJyZWZyZXNoIiwiaWF0IjoxNzYyNDc3NjI1LCJleHAiOjE3NjI5MDk2MjV9.CHd-R8t2-HORjihxrRIEASjTg09nrZksOQ3rxG2o43E\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures {
        compose true
        viewBinding true
        buildConfig = true  // BuildConfig 생성 활성화
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests.includeAndroidResources = true
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
        animationsDisabled = true
    }

    packaging {
        resources {
            excludes += "META-INF/INDEX.LIST"
            excludes += "META-INF/*.SF"
            excludes += "META-INF/*.DSA"
            excludes += "META-INF/*.RSA"
            excludes += "META-INF/DEPENDENCIES"
        }
    }
}

