services:
  backend:
    container_name: spring
    build: ./backend
    expose: # nginx 리버스 프록시를 사용하므로 ports 대신 expose 사용
      - "8080"
    networks:
      - onair-network # 커스텀 네트워크 사용 
    environment:
      # Application
      - SPRING_APPLICATION_NAME=demo
      # Database
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=com.mysql.cj.jdbc.Driver
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/onair
      - SPRING_DATASOURCE_USERNAME=${SPRING_DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DB_PASSWORD}
      # Mybatis
      - MYBATIS_CONFIGURATION_MAP_UNDERSCORE_TO_CAMEL_CASE=true
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRATION=${JWT_ACCESS_TOKEN_EXPIRATION:-7200000}
      - JWT_REFRESH_TOKEN_EXPIRATION=${JWT_REFRESH_TOKEN_EXPIRATION:-432000000}
      # LiveKit
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      # Company UUID
      - COMPANY_UUID_EXPIRATION=${COMPANY_UUID_EXPIRATION:-1800000}
      # Spring Security
      - SPRING_SECURITY_USER_NAME=${SPRING_SECURITY_USER_NAME:-admin}
      - SPRING_SECURITY_USER_PASSWORD=${SPRING_SECURITY_USER_PASSWORD}
      # Logging
      - LOGGING_LEVEL_SSAFY_COM_ONAIR=debug
      - LOGGING_LEVEL_COM_ZAXXER_HIKARI=info
      - LOGGING_PATTERN_CONSOLE=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

  frontend:
    container_name: react
    build:
      context: ./frontend
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_SOCKET_URL=${VITE_SOCKET_URL}
    expose: 
      - "3000"
    networks:
      - onair-network # 커스텀 네트워크 사용

  ai_server:
    container_name: fastapi
    build: ./ai_server/rag_server
    expose:
      - "8000"
    networks:
      - onair-network # 커스텀 네트워크 사용 
    volumes:
      # GCP TTS 크레덴셜 파일 마운트 (보안상 이미지에 포함하지 않음)
      # Jenkins에서 파일 경로를 환경변수로 전달: GCP_TTS_CREDENTIALS_PATH
      - ${GCP_TTS_CREDENTIALS_PATH}:/app/credentials/tts-key.json:ro
    environment:
      # data & embedding
      - JSONL_PATH=${JSONL_PATH}
      - FAISS_INDEX_PATH=${FAISS_INDEX_PATH}
      - EMB_MODEL_NAME=BAAI/bge-m3
      - FAISS_METRIC=cosine
      - EMB_ENCODING_MODE=query
      # Hybrid / Rerank options
      - USE_ELASTIC=True  # Elasticsearch 활성화 (Hybrid Search 사용)
      - ES_HOST=http://elastic-search:9200
      - ES_INDEX=samkos
      - USE_CROSS_ENCODER=true
      - CE_MODEL_NAME=BAAI/bge-reranker-large
      - CE_MAXLEN=256
      - HYBRID_ALPHA=0.82
      - RERANK_TOP_K=6
      - RERANK_WEIGHT=0.6
      - TOP_K=8
      # LLM 
      - LLM_PROVIDER=gms
      - GMS_API_KEY=${GMS_API_KEY}
      - GMS_MODEL_GATE=gemini-1.5-flash
      - GMS_MODEL_GENERATOR=gpt-4o
      # Answerability Gate Thresholds
      - ANSW_MIN_DOCS=2
      - ANSW_MIN_HYBRID=0.12
      - ANSW_MIN_RERANK=5.2
      - ANSW_MIN_QUERY_LEN=6
      # TTS
      - GCP_TTS_CREDENTIALS_PATH=/app/credentials/tts-key.json
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PREFIX=rag_chat

  elastic-search:
    container_name: elastic-search
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.0
    environment:
      # 메모리 제한 설정 (힙 메모리 1GB로 제한)
      # 권장 범위: 512MB ~ 2GB (데이터 크기에 따라 조정)
      # - 최소: 512MB (소규모 데이터, ~1만 문서)
      # - 권장: 1GB (중규모 데이터, ~10만 문서) ← 현재 설정
      # - 최적: 2GB (대규모 데이터, ~100만 문서)
      # 주의: 힙 메모리는 전체 컨테이너 메모리의 50% 이하로 설정 권장
      - "ES_JAVA_OPTS=-Xms1g -Xmx1g"
      # 단일 노드 모드 (클러스터 설정 불필요)
      - discovery.type=single-node
      # 보안 기능 비활성화 (개발 환경용)
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    expose:
      - "9200"
    networks:
      - onair-network
    # 메모리 제한 설정 (컨테이너 레벨)
    # 힙 메모리(1GB) + OS 캐시(1GB) = 총 2GB
    # 권장 범위: 1.5GB ~ 4GB (힙 메모리의 1.5~2배)
    mem_limit: 2g
    mem_reservation: 1g
    # CPU 제한 (선택사항)
    # 권장: 1.0 ~ 2.0 코어 (쿼리 빈도에 따라 조정)
    cpus: '1.0'
    # 볼륨 마운트 (데이터 영속성)
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    # 헬스체크 (Elasticsearch 8.x는 기본 헬스체크 엔드포인트 사용)
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/elasticsearch/bin/elasticsearch && exit 0 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# 볼륨 설정
volumes:
  elasticsearch-data:
    driver: local

# 도커 네트워크 설정 
networks:
  onair-network:
    external: true  # 이미 생성된 네트워크 사용